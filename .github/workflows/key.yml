- name: Generate and output signing keystore (run once)
        if: steps.check_build.outputs.build_needed == 'true'
        run: |
          cd src
          keytool -genkey -v \
            -keystore app/fongmi.jks \
            -alias fongmi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fongmi123 \
            -keypass fongmi123 \
            -dname "CN=FongMi" \
            -noprompt
          echo "=== COPY THIS TO SECRETS (KEYSTORE_BASE64) ==="
          base64 -w 0 app/fongmi.jks
          echo ""
          echo "=== SECRETS TO CREATE ==="
          echo "KEYSTORE_BASE64: 上面的长字符串"
          echo "KEYSTORE_PASSWORD: fongmi123"
          echo "KEY_ALIAS: fongmi"
          echo "KEY_PASSWORD: fongmi123"
