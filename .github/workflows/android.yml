name: Build TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 9.6.1 缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Clean Android Cache
        run: rm -rf ~/.android/cache || true

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      # 安装 SDK
      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # 自动生成签名
      - name: Generate Release Keystore
        run: |
          if [ ! -f release.jks ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore release.jks \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=TV,O=FongMi,C=CN"
          fi

      # local.properties
      - name: Generate local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=$GITHUB_WORKSPACE/release.jks
          storePassword=123456
          keyAlias=release
          keyPassword=123456
          EOF

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      # 编译 Release
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # 显示 APK
      - name: List APK
        run: find app/build/outputs/apk -name "*.apk"

      # 上传 APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-release
          path: app/build/outputs/apk/**/*.apk

      # 创建 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Build ${{ github.run_number }}
          files: app/build/outputs/apk/**/*.apk
