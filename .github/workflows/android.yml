name: Build TV APK

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    # 拉源码
    - name: Checkout
      uses: actions/checkout@v4


    # Java 21
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21


    # Gradle缓存
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4


    # Android SDK
    - name: Setup Android
      uses: android-actions/setup-android@v3


    - name: Accept SDK License
      run: |
        yes | sdkmanager --licenses || true


    # 生成固定签名
    - name: Create Keystore
      run: |

        if [ ! -f release.jks ]; then

        keytool \
        -genkeypair \
        -v \
        -keystore release.jks \
        -alias release \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -storepass 123456 \
        -keypass 123456 \
        -dname "CN=TV,O=FongMi,C=CN"

        fi



    # 生成local.properties
    - name: Create local.properties
      run: |

        cat > local.properties <<EOF

sdk.dir=$ANDROID_HOME

storeFile=$GITHUB_WORKSPACE/release.jks

storePassword=123456

keyAlias=release

keyPassword=123456

EOF



    # gradle权限
    - name: Permission
      run: chmod +x gradlew



    # 编译全部Release
    - name: Build Release
      run: |

        ./gradlew \
        assembleRelease \
        --stacktrace \
        --no-daemon



    # 上传APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: TV-release

        path: |

          app/build/outputs/apk/**/release/*.apk



    # 发布Release
    - name: Github Release
      uses: softprops/action-gh-release@v2
      with:

        tag_name: build-${{ github.run_number }}

        name: TV Build ${{ github.run_number }}

        files: |

          app/build/outputs/apk/**/release/*.apk
