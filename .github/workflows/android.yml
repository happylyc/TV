name: Build TV Leanback

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SOURCE_REPO: "FongMi/TV"
      SOURCE_BRANCH: "leanback"

    steps:
      - name: Checkout self repo
        uses: actions/checkout@v4

      - name: Checkout FongMi TV leanback
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: src

      - name: Generate keystore automatically
        run: |
          echo "🔐 Generating keystore..."
          keytool -genkeypair \
            -v \
            -keystore keystore.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=TV,O=FongMi,C=CN"
          echo "Keystore generated."

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Prepare local.properties
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          cat > src/local.properties <<EOF
          sdk.dir=$SDK_DIR
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          storePassword=123456
          keyAlias=release
          keyPassword=123456
          EOF

      - name: Build APK
        run: |
          cd src
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore.jks" \
            -Pandroid.injected.signing.store.password="123456" \
            -Pandroid.injected.signing.key.alias="release" \
            -Pandroid.injected.signing.key.password="123456" \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Leanback
          path: src/**/build/outputs/apk/**/release/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "TV Leanback Build ${{ github.run_number }}"
          files: src/**/build/outputs/apk/**/release/*.apk
