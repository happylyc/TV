name: Build APK

on:
  workflow_dispatch: # 允许在 GitHub 页面上手动点击触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 1. 预装 Python 编译环境及核心组件
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Python Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-venv python3-pip

    # 2. 配置系统的 Android 编译链
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 3. 饱和式注入本地配置，彻底解决 Null 转文件崩溃
    - name: Create Complete local.properties
      run: |
        touch local.properties
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        
        touch mock.jks
        echo "storeFile=../mock.jks" >> local.properties
        echo "storePassword=android" >> local.properties
        echo "keyAlias=androiddebugkey" >> local.properties
        echo "keyPassword=android" >> local.properties
        
        echo "RELEASE_STORE_FILE=../mock.jks" >> local.properties
        echo "RELEASE_STORE_PASSWORD=android" >> local.properties
        echo "RELEASE_KEY_ALIAS=androiddebugkey" >> local.properties
        echo "RELEASE_KEY_PASSWORD=android" >> local.properties

    # 4. 强制修复依赖项：限制只编译 arm64-v8a (目前绝大多数电视盒子和手机通用架构)
    # 并通过 abiFilters 强行过滤掉多余的架构编译，防止 media3 依赖拉取冲突
    - name: Build with Gradle
      run: |
        ./gradlew assembleDebug \
          -Pandroid.injected.build.abi=arm64-v8a \
          --refresh-dependencies \
          --stacktrace

    # 5. 上传生成的 APK 文件
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FongMi-TV-APK
        path: app/build/outputs/apk/**/*.apk
