name: Build LeanbackArm64_v8a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.10 for Chaquopy
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.10 python3.10-venv python3.10-distutils
          echo "PYTHON=/usr/bin/python3.10" >> $GITHUB_ENV
          echo "PYTHONHOME=/usr/bin/python3.10" >> $GITHUB_ENV
          echo "PYTHONPATH=/usr/bin/python3.10" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties + debug keystore
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=/tmp/debug.keystore" >> local.properties
          echo "keyAlias=androiddebugkey" >> local.properties
          echo "storePassword=android" >> local.properties
          echo "keyPassword=android" >> local.properties
          keytool -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=,OU=,O=,L=,S=,C="

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Leanback Arm64_v8a
        run: ./gradlew assembleLeanbackArm64_v8aRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leanback-arm64_v8a
          path: app/build/outputs/apk/leanback/arm64_v8a/release/*.apk
          if-no-files-found: warn
