name: Build FongMi TV & Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      # 确保系统自带的 Python3 就绪
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 使用官方 Actions 确保 Android SDK 完整，并安装 NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      # 🛠️ 核心修复 1：全局递归修复所有子模块中可能硬编码的 Windows Python 路径
      - name: Patch Hardcoded Python Path in All Modules
        run: |
          PYTHON_PATH=$(which python3)
          echo "Real Linux Python Path: $PYTHON_PATH"
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i "s|D:/Programs/Python/Python38/python.exe|$PYTHON_PATH|g"
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i "s|C:/.*python.exe|$PYTHON_PATH|g"

      # 🛠️ 核心修复 2：强行剔除 app/build.gradle 中导致崩溃的硬编码签名认证逻辑，改走默认 debug 签名
      - name: Bypass Signing Configs Crash
        run: |
          if [ -f app/build.gradle ]; then
            echo "Patching app/build.gradle signing configs..."
            # 暴力将 signingConfig signingConfigs.release 替换为默认的 signingConfigs.debug
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build/outputs/../build.gradle || true
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          fi

      # 极致优化 Gradle 运行参数与网络超时上限
      - name: Optimize Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
          echo "systemProp.http.socketTimeout=60000" >> ~/.gradle/gradle.properties
          echo "systemProp.http.connectionTimeout=60000" >> ~/.gradle/gradle.properties

      # 生成基础 local.properties 供各模块使用
      - name: Create Perfect local.properties
        run: |
          PYTHON_PATH=$(which python3)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties
          echo "buildPython=$PYTHON_PATH" >> local.properties

      - name: Fix line endings for gradlew
        run: sed -i 's/\r$//' gradlew

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      # 精准编译指定架构（arm64-v8a, armeabi-v7a），只打电视版和手机版的 Debug 包
      - name: Build Leanback and Mobile with Gradle
        run: |
          ./gradlew assembleLeanbackDebug assembleMobileDebug \
            -Pandroid.injected.build.abi=arm64-v8a,armeabi-v7a \
            -x lint -x test --no-daemon --stacktrace --no-build-cache

      # 上传生成的 电视版 APK 文件
      - name: Upload Leanback (TV) APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-Leanback-APKs
          path: app/build/outputs/apk/leanback/debug/**/*.apk
          retention-days: 7

      # 上传生成的 手机版 APK 文件
      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-Mobile-APKs
          path: app/build/outputs/apk/mobile/debug/**/*.apk
          retention-days: 7
