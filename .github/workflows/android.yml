name: Build

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no changes detected"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      SOURCE_REPO: "FongMi/TV"
      SOURCE_BRANCH: "fongmi"
      API_RETRY_COUNT: 3
      API_RETRY_DELAY: 5

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: src

      - name: Capture commit hashes
        id: commit_info
        run: |
          cd src
          SHORT_HASH=$(git rev-parse --short HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y%m%d-%H%M')
          echo "short_hash=$SHORT_HASH" >> "$GITHUB_OUTPUT"
          echo "full_hash=$FULL_HASH" >> "$GITHUB_OUTPUT"
          echo "commit_date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"
          echo "Short hash: $SHORT_HASH"
          echo "Full hash: $FULL_HASH"
          echo "Commit date: $COMMIT_DATE"

      - name: Check if build is needed
        id: check_build
        run: |
          echo "Checking if build is needed..."
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "Force build requested"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "is_first_release=false" >> "$GITHUB_OUTPUT"
            echo "build_reason=force_build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_tag=""
          retry_count=0
          while [ $retry_count -lt $API_RETRY_COUNT ]; do
            echo "Fetching latest release (attempt $((retry_count + 1))/$API_RETRY_COUNT)..."
            response=$(curl -s -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest")
            http_code="${response: -3}"
            json_response="${response%???}"
            if [ "$http_code" = "200" ]; then
              latest_tag=$(echo "$json_response" | jq -r '.tag_name // "none"')
              echo "Latest release tag: $latest_tag"
              break
            elif [ "$http_code" = "404" ]; then
              echo "No releases found"
              latest_tag="none"
              break
            else
              echo "API call failed with HTTP $http_code"
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $API_RETRY_COUNT ]; then
                echo "Retrying in $API_RETRY_DELAY seconds..."
                sleep $API_RETRY_DELAY
              fi
            fi
          done
          if [ $retry_count -eq $API_RETRY_COUNT ] && [ "$http_code" != "200" ] && [ "$http_code" != "404" ]; then
            echo "Failed to fetch latest release, proceeding with build"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "is_first_release=false" >> "$GITHUB_OUTPUT"
            echo "build_reason=api_failure_fallback" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_hash="${{ steps.commit_info.outputs.short_hash }}"
          echo "Latest release tag: $latest_tag"
          echo "Current short hash: $current_hash"
          if [ "$latest_tag" = "none" ]; then
            echo "No previous releases found"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "is_first_release=true" >> "$GITHUB_OUTPUT"
            echo "build_reason=first_release" >> "$GITHUB_OUTPUT"
          elif [ "$latest_tag" != "$current_hash" ]; then
            echo "Build needed: latest tag != current hash"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "is_first_release=false" >> "$GITHUB_OUTPUT"
            echo "build_reason=code_changes" >> "$GITHUB_OUTPUT"
          else
            echo "Build not needed: latest tag matches current hash"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "is_first_release=false" >> "$GITHUB_OUTPUT"
            echo "build_reason=no_changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.check_build.outputs.build_needed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Cache Gradle dependencies
        if: steps.check_build.outputs.build_needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/**/*.gradle*', 'src/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        if: steps.check_build.outputs.build_needed == 'true'
        uses: android-actions/setup-android@v3

      - name: Setup Python
        if: steps.check_build.outputs.build_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create local.properties
        if: steps.check_build.outputs.build_needed == 'true'
        run: |
          cd src
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          python_path=$(which python3)
          if [ -z "$python_path" ]; then
            python_path=$(which python)
          fi
          echo "buildPython=$python_path" >> local.properties
          $python_path --version

      - name: Generate signing keystore and configure
        if: steps.check_build.outputs.build_needed == 'true'
        run: |
          echo "Generating temporary signing keystore..."
          cd src
          
          # 生成签名密钥
          keytool -genkey -v \
            -keystore app/fongmi.jks \
            -alias fongmi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fongmi123 \
            -keypass fongmi123 \
            -dname "CN=FongMi" \
            -noprompt
          
          # 写入 local.properties（app/build.gradle 读取这个文件！）
          echo "storeFile=app/fongmi.jks" >> local.properties
          echo "keyAlias=fongmi" >> local.properties
          echo "storePassword=fongmi123" >> local.properties
          
          echo "=== local.properties signing config ==="
          grep -E "storeFile|keyAlias|storePassword" local.properties
          
          echo "Keystore and local.properties configured"

      - name: Build release APKs
        if: steps.check_build.outputs.build_needed == 'true'
        run: |
          echo "Building release APKs..."
          cd src
          chmod +x gradlew
          
          # 构建所有 release variant（leanback arm64 + leanback armv7 + mobile）
          ./gradlew assembleRelease --no-daemon --stacktrace
          
          echo "APK build completed successfully"
          rm -f app/fongmi.jks
          echo "Keystore cleaned up"

      - name: Create GitHub Release
        if: steps.check_build.outputs.build_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit_info.outputs.short_hash }}
          name: "FongMi TV ${{ steps.commit_info.outputs.short_hash }}"
          body: |
            Build Information:
            - Commit Hash: ${{ steps.commit_info.outputs.short_hash }}
            - Commit Date: ${{ steps.commit_info.outputs.commit_date }}
            - Build Reason: ${{ steps.check_build.outputs.build_reason }}

            Downloads:
            APK files are attached to this release.
          files: src/**/build/outputs/apk/**/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "Build Summary"
          echo "Repository: ${{ github.repository }}"
          echo "Source: ${{ env.SOURCE_REPO }}@${{ env.SOURCE_BRANCH }}"
          echo "Short Hash: ${{ steps.commit_info.outputs.short_hash }}"
          if [ "${{ steps.check_build.outputs.build_needed }}" = "true" ]; then
            echo "Status: Build Executed"
            echo "Reason: ${{ steps.check_build.outputs.build_reason }}"
          else
            echo "Status: Build Skipped"
            echo "Reason: ${{ steps.check_build.outputs.build_reason }}"
          fi
