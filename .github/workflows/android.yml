name: Build FongMi TV APK

on:
  schedule:
    - cron: '0 13 1 * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: FongMi
            repoName: TV
            branchName: release
            java_ver: 17

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          
          commit=$(curl -sL $upStream/commits/${{ matrix.branchName }} | grep -o "/${{ matrix.userName }}/${{ matrix.repoName }}/commit/[a-z0-9]\+" | head -1 | cut -d\/ -f5)
          
          if [[ -z "$commit" ]]; then
            echo "方法1失败，尝试API获取..."
            commit=$(curl -s "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}?per_page=1" | jq -r '.sha // empty')
          fi
          
          if [[ -z "$commit" ]]; then
            echo "API也失败，直接克隆获取最新commit..."
            git clone --depth=1 $upStream temp_repo
            commit=$(cd temp_repo && git rev-parse HEAD)
            rm -rf temp_repo
          fi
          
          echo "获取到的commit: $commit"
          
          if [[ -z "$commit" ]]; then
            echo "错误：无法获取commit hash"
            exit 1
          fi
          
          if ! grep -q "$commit" README.md 2>/dev/null || [ "${{ inputs.rebuild }}" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
            echo "需要构建"
          else
            echo "commit=$commit" >> $GITHUB_ENV
            echo "无需构建，commit已存在"
          fi

      - name: Checkout Source Code
        if: ${{ env.commitS }}
        run: |
          git clone --branch ${{ matrix.branchName }} ${{ env.upStream }} TVBox
          cd TVBox
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd -1)" >> $GITHUB_ENV

      - name: Setup Signing
        if: ${{ env.commitS }}
        working-directory: TVBox
        run: |
          # 自动生成临时签名密钥
          keytool -genkey -v \
            -keystore app/fongmi.jks \
            -alias fongmi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fongmi123 \
            -keypass fongmi123 \
            -dname "CN=FongMi" \
            -noprompt
          
          # 配置签名到 gradle.properties
          echo "RELEASE_STORE_FILE=./app/fongmi.jks" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=fongmi" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=fongmi123" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=fongmi123" >> gradle.properties

      - uses: actions/setup-java@v4
        if: ${{ matrix.java_ver }}
        with:
          distribution: temurin
          java-version: ${{ matrix.java_ver }}

      - name: Setup Android SDK
        if: ${{ env.commitS }}
        uses: android-actions/setup-android@v3

      - name: Setup Python
        if: ${{ env.commitS }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Create local.properties
        if: ${{ env.commitS }}
        working-directory: TVBox
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          python_path=$(which python3)
          if [ -z "$python_path" ]; then
            python_path=$(which python)
          fi
          echo "buildPython=$python_path" >> local.properties
          $python_path --version

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ env.commitS }}

      - name: Build With Gradle
        if: ${{ env.commitS }}
        working-directory: TVBox
        run: |
          chmod +x gradlew
          ./gradlew assembleLeanbackRelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        if: ${{ env.commitS }}
        working-directory: TVBox
        run: |
          rm -rf apk/
          mkdir -p apk/
          
          for file in $(find app/build/outputs/apk -name "*release*.apk" -print); do
            base=$(basename "$file")
            new_base=$(echo "$base" | sed "s/release/${{ env.tag }}/")
            cp "$file" "apk/$new_base"
          done

      - name: Release Note
        if: ${{ env.commitS }}
        working-directory: TVBox
        run: |
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md | grep -o '[a-z0-9]\{40\}' | head -1)
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          
          if [ -z "$lastCommit" ]; then
            echo "首次构建" >> apk/${{ matrix.userName }}-Release.log
            git log --pretty=format:%B -1 | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          elif [ "${{ env.commit }}" == "${lastCommit}" ]; then
            git log --pretty=format:%B -1 | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          else
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          fi
          echo -e '\n```' >> apk/${{ matrix.userName }}-Release.log

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commitS }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}
          path: |
            TVBox/apk/*

      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commitS }}
        run: |
          echo "commit=" >> $GITHUB_ENV

  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
