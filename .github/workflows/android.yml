name: Build FongMi TV & Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      # 确保系统自带的 Python3 就绪
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 使用官方 Actions 确保 Android SDK 完整并安装 NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      # 全局递归修复所有子模块中可能硬编码的 Windows Python 路径
      - name: Patch Hardcoded Python Path in All Modules
        run: |
          PYTHON_PATH=$(which python3)
          echo "Real Linux Python Path: $PYTHON_PATH"
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i "s|D:/Programs/Python/Python38/python.exe|$PYTHON_PATH|g"
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i "s|C:/.*python.exe|$PYTHON_PATH|g"

      # 全方位立体伪造签名环境，堵死所有 Null 转换漏洞
      - name: Omnidirectional Mock Signing Environment
        run: |
          PYTHON_PATH=$(which python3)
          touch mock.jks
          touch app/mock.jks
          
          read -r -d '' SIGN_PROPS << EOM || true
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
          buildPython=$PYTHON_PATH
          RELEASE_STORE_FILE=mock.jks
          RELEASE_STORE_PASSWORD=mock_pwd
          RELEASE_KEY_ALIAS=mock_alias
          RELEASE_KEY_PASSWORD=mock_pwd
          releaseStoreFile=mock.jks
          releaseStorePassword=mock_pwd
          releaseKeyAlias=mock_alias
          releaseKeyPassword=mock_pwd
          storeFile=mock.jks
          storePassword=mock_pwd
          keyAlias=mock_alias
          keyPassword=mock_pwd
          EOM
          
          echo "$SIGN_PROPS" > local.properties
          echo "$SIGN_PROPS" > app/local.properties
          echo "$SIGN_PROPS" >> gradle.properties
          echo "$SIGN_PROPS" >> app/gradle.properties
          echo "$SIGN_PROPS" > release.properties
          echo "$SIGN_PROPS" > app/release.properties

      # 极致优化 Gradle 运行参数与网络超时上限
      - name: Optimize Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
          echo "systemProp.http.socketTimeout=60000" >> ~/.gradle/gradle.properties
          echo "systemProp.http.connectionTimeout=60000" >> ~/.gradle/gradle.properties

      - name: Fix line endings for gradlew
        run: sed -i 's/\r$//' gradlew

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      # 🛠️ 核心修复：改用万能的 assembleDebug 命令，避开对渠道具体名称的猜测，同时靠 ABI 过滤强制瘦身
      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.build.abi=arm64-v8a,armeabi-v7a \
            -x lint -x test --no-daemon --stacktrace --no-build-cache

      # 收集所有生成的编译产物（通配符匹配所有渠道，电视和手机都会被打包进去）
      - name: Upload All Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-All-Flavors-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
