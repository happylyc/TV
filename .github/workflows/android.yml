- name: Generate signing keystore and configure
  if: steps.check_build.outputs.build_needed == 'true'
  run: |
 echo "Generating temporary signing keystore..."
  cd src
          
          # 生成签名密钥到项目根目录
          keytool -genkey -v \
            -keystore fongmi.jks \
            -alias fongmi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fongmi123 \
            -keypass fongmi123 \
            -dname "CN=FongMi" \
            -noprompt
          
          # 创建 keystore.properties（项目根目录，app/build.gradle 读取这里）
          echo "storeFile=fongmi.jks" > keystore.properties
          echo "storePassword=fongmi123" >> keystore.properties
          echo "keyAlias=fongmi" >> keystore.properties
          echo "keyPassword=fongmi123" >> keystore.properties
          
          echo "=== keystore.properties ==="
          cat keystore.properties
          echo "=== Files ==="
          ls -la fongmi.jks keystore.properties
          
          echo "Keystore and properties configured"
