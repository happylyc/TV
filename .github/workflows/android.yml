name: Build FongMi TV & Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      # 确保系统自带的 Python3 就绪
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 核心修复 1：全局递归修复所有子模块中可能硬编码的 Windows Python 路径
      - name: Patch Hardcoded Python Path in All Modules
        run: |
          PYTHON_PATH=$(which python3)
          echo "Real Linux Python Path: $PYTHON_PATH"
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i "s|D:/Programs/Python/Python38/python.exe|$PYTHON_PATH|g"
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i "s|C:/.*python.exe|$PYTHON_PATH|g"

      # 核心修复 2：全方位立体伪造签名环境，堵死所有 Null 转换漏洞
      - name: Omnidirectional Mock Signing Environment
        run: |
          PYTHON_PATH=$(which python3)
          touch mock.jks
          touch app/mock.jks
          
          read -r -d '' SIGN_PROPS << EOM || true
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk-bundle
          buildPython=$PYTHON_PATH
          RELEASE_STORE_FILE=mock.jks
          RELEASE_STORE_PASSWORD=mock_pwd
          RELEASE_KEY_ALIAS=mock_alias
          RELEASE_KEY_PASSWORD=mock_pwd
          releaseStoreFile=mock.jks
          releaseStorePassword=mock_pwd
          releaseKeyAlias=mock_alias
          releaseKeyPassword=mock_pwd
          storeFile=mock.jks
          storePassword=mock_pwd
          keyAlias=mock_alias
          keyPassword=mock_pwd
          EOM
          
          echo "$SIGN_PROPS" > local.properties
          echo "$SIGN_PROPS" > app/local.properties
          echo "$SIGN_PROPS" >> gradle.properties
          echo "$SIGN_PROPS" >> app/gradle.properties
          echo "$SIGN_PROPS" > release.properties
          echo "$SIGN_PROPS" > app/release.properties

      # 核心修复 3：强行在所有配置库的地方注入官方公共源，防止 media3 等核心依赖下载失败
      - name: Inject Reliable Maven Repositories
        run: |
          find . -name "build.gradle" -o -name "settings.gradle" | while read -r file; do
            if grep -q "repositories {" "$file"; then
              echo "Injecting global repositories into $file"
              sed -i 's/repositories {/repositories {\n        google()\n        mavenCentral()/g' "$file"
            fi
          done

      # 极致优化 Gradle 运行参数，增加超时上限与重试，彻底杜绝网络断流
      - name: Optimize Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
          echo "systemProp.http.socketTimeout=120000" >> ~/.gradle/gradle.properties
          echo "systemProp.http.connectionTimeout=120000" >> ~/.gradle/gradle.properties

      - name: Fix line endings for gradlew
        run: sed -i 's/\r$//' gradlew

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      # 核心修复 4：移除前端过滤 ABI 参数，改用原生全量编译，确保 C 语言层（quickjs）顺利链接
      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug \
            -x lint -x test --no-daemon --stacktrace --refresh-dependencies

      # 核心修复 5：编译完成后，在 Actions 后台用 Linux 命令直接剥离 APK 内部的 x86 脂肪，实现完美瘦身
      - name: Post-Build Slimming
        if: success()
        run: |
          sudo apt-get install -y zip
          find app/build/outputs/apk/ -name "*.apk" | while read -r apk; do
            echo "正在剥离 x86 与 x86_64 架构以缩减体积: $apk"
            zip -d "$apk" "lib/x86/*" "lib/x86_64/*" || true
          done

      # 万能通配符抓取：如果成功则上传瘦身后的完美版 APK，如果失败则强行上传打包报告以供排查
      - name: Upload All Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-Build-Output
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/reports/**/*
          retention-days: 7
